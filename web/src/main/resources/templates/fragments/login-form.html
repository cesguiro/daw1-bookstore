<!-- Fragmento de formulario de login -->
<div th:fragment="loginForm">
  <div class="c-content">
    <h1 th:text="#{login.title}">Login</h1>

    <!-- Formulario de login -->
    <form th:action="@{/login}" method="post" class="c-form">
      <div class="c-form__group">
        <label for="email" th:text="#{login.email}">Correo Electrónico</label>
        <input type="email" id="email" name="email" required class="c-form__input" th:placeholder="#{login.placeholder.email}">
      </div>

      <div class="c-form__group">
        <label for="password" th:text="#{login.password}">Contraseña</label>
        <input type="password" id="password" name="password" required class="c-form__input" th:placeholder="#{login.placeholder.password}">
      </div>

      <!-- Mostrar error si existe -->
      <div th:if="${error != null}" class="c-form__error">
        <span th:text="#{${error}}">Error de validación</span>
      </div>

      <button type="submit" class="c-button c-button--primary" th:text="#{login.submit}">Login</button>
    </form>

    <!-- Enlace a la página de login si ya tienes cuenta -->
    <p>
      <span th:text="#{login.noAccount}">¿No tienes cuenta?</span>
      <a href="/register" th:text="#{login.register}">Registrarse</a>
    </p>
  </div>
</div>
